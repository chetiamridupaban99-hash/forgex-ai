<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ForgeX AI</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="logo">
      🤖 <span>ForgeX AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="menu">

      <button>💬 AI Chat</button>

      <button>🖼 Image AI</button>

      <button>💻 Code AI</button>

      <button>📄 PDF AI</button>

      <button>⚙ Settings</button>

    </div>

  </aside>

  <!-- Main -->

  <main class="main">

    <div class="topbar">

      <h2>ForgeX AI</h2>

      <span class="status">
        🟢 Online
      </span>

    </div>

    <!-- Chat -->

    <div id="chat" class="chat">

      <div class="bot welcome">

        <h2>👋 Welcome to ForgeX AI</h2>

        <p>
          Your intelligent AI assistant is ready.
        </p>

        <p>
          Ask me anything about coding, studies,
          technology, writing, ideas and much more.
        </p>

      </div>

    </div>

    <!-- Typing -->

    <div id="typing" class="typing">
      🤖 ForgeX AI is thinking...
    </div>

    <!-- Input -->

    <div class="input-area">

      <input
        id="prompt"
        type="text"
        placeholder="Message ForgeX AI..."
        autocomplete="off"
      >

      <button
        class="voice-btn"
        onclick="startVoice()">
        🎤
      </button>

      <button
        class="send-btn"
        onclick="sendMessage()">
        ➤
      </button>

    </div>

  </main>

</div>

<!-- Markdown Support -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Main Script -->
<script src="script.js"></script>

</body>
</html>
