<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeX AI</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  width:90%;
  max-width:500px;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
}
button{
  margin-top:10px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:16px;
}
#output{
  margin-top:20px;
  background:#222;
  padding:15px;
  border-radius:10px;
}
</style>
</head>
<body>

<div class="box">
<h1>ForgeX AI</h1>

<input id="prompt" placeholder="Ask anything...">
<button onclick="chat()">Send</button>

<div id="output">Welcome to ForgeX AI 🚀</div>
</div>

<script>
function chat(){
  const text=document.getElementById("prompt").value;
  document.getElementById("output").innerHTML=
  "You asked: <br><b>"+text+"</b><br><br>Gemini API will be connected next.";
}
</script>

</body>
</html>
